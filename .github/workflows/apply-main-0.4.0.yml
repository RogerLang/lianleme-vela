name: Apply 0.4.0 main fix

on:
  push:
    branches:
      - fix/main-0.4.0-sync-icon

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/main-0.4.0-sync-icon
          fetch-depth: 0

      - name: Apply focused 0.4.0 changes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def one(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing marker: {label}')
              return text.replace(old, new, 1)

          def sub1(text, pattern, repl, label):
              out, count = re.subn(pattern, repl, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'pattern mismatch {label}: {count}')
              return out

          text = read('package.json')
          write('package.json', one(text, '"version": "0.3.0"', '"version": "0.4.0"', 'package version'))

          text = read('package-lock.json')
          if text.count('"version": "0.3.0"') < 2:
              raise SystemExit('package-lock version markers missing')
          write('package-lock.json', text.replace('"version": "0.3.0"', '"version": "0.4.0"', 2))

          text = read('src/manifest.json')
          text = one(text, '"versionName": "0.3.0",\n  "versionCode": 9', '"versionName": "0.4.0",\n  "versionCode": 14', 'manifest version')
          write('src/manifest.json', text)

          text = read('scripts/generate-icon.mjs')
          text = one(
              text,
              'fillCanvas([0, 0, 0, 255]);\nfillCircle(s(96), s(96), s(76), [246, 248, 251, 255]);\nfillRoundedRect(s(48), s(60), s(72), s(18), s(6), [91, 154, 222, 255]);\nfillRoundedRect(s(48), s(87), s(88), s(18), s(6), [62, 124, 201, 255]);\nfillRoundedRect(s(48), s(114), s(104), s(18), s(6), [43, 96, 174, 255]);',
              '// Transparent corners make the launcher silhouette circular.\n// Use a 186px footprint so the icon fills the launcher slot more naturally.\nfillCircle(s(96), s(96), s(93), [246, 248, 251, 255]);\nfillRoundedRect(s(40), s(56), s(84), s(22), s(8), [91, 154, 222, 255]);\nfillRoundedRect(s(40), s(85), s(104), s(22), s(8), [62, 124, 201, 255]);\nfillRoundedRect(s(40), s(114), s(122), s(22), s(8), [43, 96, 174, 255]);',
              'launcher icon block'
          )
          write('scripts/generate-icon.mjs', text)

          text = read('src/common/workout-protocol.js')
          helper = '''function normalizeProgress(value) {
            if (!value || typeof value !== 'object') {
              return null
            }
            var records = Array.isArray(value.completedRecords) ? value.completedRecords : []
            return {
              workoutId: String(value.workoutId || ''),
              revision: String(value.revision || ''),
              planId: String(value.planId || ''),
              status: value.status === 'complete' || value.status === 'ready' ? value.status : 'active',
              screen: String(value.screen || 'workout'),
              exerciseIndex: Math.max(0, Math.floor(Number(value.exerciseIndex) || 0)),
              setIndex: Math.max(0, Math.floor(Number(value.setIndex) || 0)),
              pendingExerciseIndex: Math.max(0, Math.floor(Number(value.pendingExerciseIndex) || 0)),
              pendingSetIndex: Math.max(0, Math.floor(Number(value.pendingSetIndex) || 0)),
              restEndAt: Math.max(0, Number(value.restEndAt) || 0),
              updatedAt: Math.max(0, Number(value.updatedAt) || 0),
              completedRecords: records.map(function(record) {
                record = record || {}
                return {
                  exerciseIndex: Math.max(0, Math.floor(Number(record.exerciseIndex) || 0)),
                  setIndex: Math.max(0, Math.floor(Number(record.setIndex) || 0)),
                  plannedWeight: numberOrNull(record.plannedWeight),
                  plannedReps: numberOrNull(record.plannedReps),
                  actualWeight: numberOrNull(record.actualWeight),
                  actualReps: numberOrNull(record.actualReps),
                  completedAt: Math.max(0, Number(record.completedAt) || 0)
                }
              })
            }
          }

          function progressMatchesPlan(progress, workout) {
            if (!progress || !workout) {
              return false
            }
            return String(progress.workoutId || '') === String(workout.id || '') &&
              String(progress.revision || '') === String(workout.revision || '')
          }

          '''
          text = one(text, 'function progressPayload(workout, state) {', helper + 'function progressPayload(workout, state) {', 'protocol helper insertion')
          text = one(text, '  samePlan: samePlan,\n  progressPayload: progressPayload', '  samePlan: samePlan,\n  normalizeProgress: normalizeProgress,\n  progressMatchesPlan: progressMatchesPlan,\n  progressPayload: progressPayload', 'protocol exports')
          write('src/common/workout-protocol.js', text)

          text = read('src/pages/index/index.ux')
          text = one(text, "var APP_VERSION = '0.3.0'", "var APP_VERSION = '0.4.0'", 'app version')
          text = one(text, '\nexport default {', "\nfunction recordKey(exerciseIndex, setIndex) {\n  return String(exerciseIndex) + ':' + String(setIndex)\n}\n\nexport default {", 'recordKey')
          text = one(text, "    completionSynced: false,\n    doneStatusTitle: '已保存在手环',", "    completionSynced: false,\n    syncPending: false,\n    progressUpdatedAt: 0,\n    lastAckUpdatedAt: 0,\n    doneStatusTitle: '已保存在手环',", 'private sync fields')
          text = one(text, '    this.completionSynced = !!state.completionSynced\n\n    var plannedSet', "    this.completionSynced = !!state.completionSynced\n    this.progressUpdatedAt = Number(state.progressUpdatedAt || state.updatedAt) || nowMs()\n    this.lastAckUpdatedAt = Number(state.lastAckUpdatedAt) || 0\n    this.syncPending = typeof state.syncPending === 'boolean'\n      ? state.syncPending\n      : (this.completedRecords.length > 0 && !this.completionSynced)\n\n    var plannedSet", 'restore sync state')
          text = one(text, '      completionSynced: this.completionSynced,\n      updatedAt: nowMs()', '      completionSynced: this.completionSynced,\n      updatedAt: this.progressUpdatedAt || nowMs(),\n      progressUpdatedAt: this.progressUpdatedAt || nowMs(),\n      syncPending: this.syncPending,\n      lastAckUpdatedAt: this.lastAckUpdatedAt', 'snapshot sync fields')
          text = one(text, '\n  saveState() {', "\n  markProgressDirty() {\n    this.progressUpdatedAt = nowMs()\n    this.syncPending = true\n    if (this.screen === 'complete') {\n      this.completionSynced = false\n    }\n  },\n\n  saveState() {", 'mark dirty method')
          text = one(text, '    this.completionConfirmed = false\n    this.completionSynced = false\n    this.refreshDoneStatus()\n    this.loadCurrentSet()', '    this.completionConfirmed = false\n    this.completionSynced = false\n    this.syncPending = false\n    this.progressUpdatedAt = nowMs()\n    this.lastAckUpdatedAt = 0\n    this.refreshDoneStatus()\n    this.loadCurrentSet()', 'reset sync state')
          text = one(text, "    if (message.type === 'progress-ack') {", "    if (message.type === 'progress') {\n      this.applyIncomingProgress(message.payload)\n      return\n    }\n    if (message.type === 'progress-ack') {", 'progress message branch')

          replacement = '''  applyProgressAck(payload) {
            payload = payload || {}
            if (String(payload.workoutId || '') !== String(WORKOUT.id || '') ||
                String(payload.revision || '') !== String(WORKOUT.revision || '')) {
              return
            }
            var ackAt = Number(payload.updatedAt) || 0
            if (ackAt > 0 && ackAt < Number(this.progressUpdatedAt || 0)) {
              return
            }
            this.syncPending = false
            this.lastAckUpdatedAt = ackAt || nowMs()
            if (this.screen === 'complete') {
              this.completionSynced = true
            }
            this.refreshDoneStatus()
            this.saveState()
          },

          applyIncomingProgress(payload) {
            var progress = protocol.normalizeProgress(payload)
            if (!progress || !protocol.progressMatchesPlan(progress, WORKOUT)) {
              return
            }
            if (this.syncPending) {
              this.publishProgress()
              return
            }

            var records = []
            var completed = {}
            for (var i = 0; i < progress.completedRecords.length; i++) {
              var record = progress.completedRecords[i]
              if (!validSetIndex(record.exerciseIndex, record.setIndex)) {
                continue
              }
              var key = recordKey(record.exerciseIndex, record.setIndex)
              if (completed[key]) {
                continue
              }
              completed[key] = true
              records.push(record)
            }

            var previousCompleted = this.completedRecords.length
            var previousScreen = this.screen
            this.stopRestTimer()
            this.completedRecords = records
            this.completedSets = records.length
            this.canUndo = this.completedSets > 0
            this.restEndAt = 0
            this.restRemaining = 0
            this.editing = false
            this.editToggleText = '调整本组'
            this.editOriginalWeight = null
            this.editOriginalReps = 0
            this.completionConfirmed = false
            this.progressUpdatedAt = progress.updatedAt || nowMs()
            this.lastAckUpdatedAt = this.progressUpdatedAt
            this.syncPending = false

            var next = this.firstIncompleteIndices(completed)
            if (progress.status === 'complete' || !next) {
              this.screen = 'complete'
              this.completionSynced = true
              var lastExerciseIndex = Math.max(0, WORKOUT.exercises.length - 1)
              var lastSetIndex = Math.max(0, WORKOUT.exercises[lastExerciseIndex].sets.length - 1)
              this.exerciseIndex = lastExerciseIndex
              this.setIndex = lastSetIndex
              this.pendingExerciseIndex = lastExerciseIndex
              this.pendingSetIndex = lastSetIndex
              this.loadCurrentSet()
            } else {
              this.screen = 'workout'
              this.completionSynced = false
              this.exerciseIndex = next.exerciseIndex
              this.setIndex = next.setIndex
              this.pendingExerciseIndex = next.exerciseIndex
              this.pendingSetIndex = next.setIndex
              this.loadCurrentSet()
            }

            this.refreshDoneStatus()
            this.saveState()
            if (this.completedRecords.length !== previousCompleted || this.screen !== previousScreen) {
              vibrator.vibrate({ mode: 'short' })
            }
            this.sendEnvelope('progress-ack', {
              workoutId: String(WORKOUT.id || ''),
              revision: String(WORKOUT.revision || ''),
              planId: String(WORKOUT.planId || ''),
              updatedAt: this.progressUpdatedAt
            })
          },

          firstIncompleteIndices(completed) {
            for (var exerciseIndex = 0; exerciseIndex < WORKOUT.exercises.length; exerciseIndex++) {
              var exercise = WORKOUT.exercises[exerciseIndex]
              for (var setIndex = 0; setIndex < exercise.sets.length; setIndex++) {
                if (!completed[recordKey(exerciseIndex, setIndex)]) {
                  return { exerciseIndex: exerciseIndex, setIndex: setIndex }
                }
              }
            }
            return null
          },

          applyIncomingPlan(payload) {'''
          text = sub1(text, r"  applyProgressAck\(payload\) \{.*?\n  \},\n\n  applyIncomingPlan\(payload\) \{", replacement, 'progress handlers')

          text = sub1(
              text,
              r"    var same = protocol\.samePlan\(WORKOUT, plan\)\n    var activeLocalSession = this\.completedRecords\.length > 0 && this\.screen !== 'complete'\n    if \(!same && activeLocalSession && WORKOUT\.id && WORKOUT\.revision\) \{\n      this\.publishProgress\(\)\n      return\n    \}\n\n    if \(same\) \{\n      return\n    \}\n\n    if \(this\.screen === 'complete' && !this\.completionSynced\) \{\n      this\.publishProgress\(\)\n    \}\n\n    WORKOUT = plan",
              "    var same = protocol.samePlan(WORKOUT, plan)\n    var activeLocalSession = this.completedRecords.length > 0 && this.screen !== 'complete'\n    var unsyncedLocalSession = this.syncPending && WORKOUT.id && WORKOUT.revision\n    if (!same && (activeLocalSession || unsyncedLocalSession)) {\n      this.publishProgress()\n      return\n    }\n\n    if (same) {\n      if (this.syncPending) {\n        this.publishProgress()\n      }\n      return\n    }\n\n    WORKOUT = plan",
              'plan conflict rule'
          )
          text = one(text, "    this.setProgress = this.completedSets + ' / ' + this.totalSets\n    vibrator.vibrate({ mode: 'short' })", "    this.setProgress = this.completedSets + ' / ' + this.totalSets\n    this.markProgressDirty()\n    vibrator.vibrate({ mode: 'short' })", 'complete set dirty')
          text = one(text, '    this.loadCurrentSet(record.actualWeight, record.actualReps)\n    this.refreshDoneStatus()', '    this.loadCurrentSet(record.actualWeight, record.actualReps)\n    this.markProgressDirty()\n    this.refreshDoneStatus()', 'undo dirty')
          write('src/pages/index/index.ux', text)

          text = read('scripts/check.mjs')
          marker = 'if (!protocol.includes("lianleme.workout") || !protocol.includes("VERSION = 1")) fail("Workout Protocol V1 marker is missing");'
          extra = marker + '\nfor (const marker of ["applyIncomingProgress", "progress-ack", "syncPending"]) {\n  if (!page.includes(marker)) fail(`bidirectional wearable sync marker missing: ${marker}`);\n}\nfor (const marker of ["normalizeProgress", "progressMatchesPlan"]) {\n  if (!protocol.includes(marker)) fail(`bidirectional protocol marker missing: ${marker}`);\n}'
          text = one(text, marker, extra, 'check bidirectional markers')
          write('scripts/check.mjs', text)

          text = read('README.md')
          text = text.replace('当前实机测试基线为 0.3.0：', '当前实机测试基线为 0.4.0：', 1)
          text = text.replace('versionName 0.3.0\nversionCode 9', 'versionName 0.4.0\nversionCode 14', 1)
          text = text.replace('0.3.0 接入手机 ↔ 手环 Workout Protocol V1', '0.4.0 接入手机 ↔ 手环 Workout Protocol V1', 1)
          text = text.replace('当前 0.3.0 已作为首轮真机测试基线冻结。', '当前 0.4.0 已作为双向同步真机测试基线。', 1)
          bullet = '- 完成组、撤销、完成训练后回传 progress snapshot\n'
          if bullet in text and '手机端进度变化同步回手环' not in text:
              text = text.replace(bullet, bullet + '- 手机端进度变化同步回手环，并回传 progress-ack\n', 1)
          write('README.md', text)
          PY

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/apply-main-0.4.0.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix: Vela 0.4.0 bidirectional sync and launcher icon"
          git push origin HEAD:fix/main-0.4.0-sync-icon
