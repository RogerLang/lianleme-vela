name: Apply 0.4.0 main fix

on:
  push:
    branches:
      - fix/main-0.4.0-sync-icon

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/main-0.4.0-sync-icon
          fetch-depth: 0

      - name: Apply focused 0.4.0 changes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing expected block in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          def replace_n(path, old, new, count):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) < count:
                  raise SystemExit(f'expected {count} occurrences in {path}: {old!r}')
              p.write_text(text.replace(old, new, count), encoding='utf-8')

          replace_once('package.json', '"version": "0.3.0"', '"version": "0.4.0"')
          replace_n('package-lock.json', '"version": "0.3.0"', '"version": "0.4.0"', 2)
          replace_once('src/manifest.json', '"versionName": "0.3.0",\n  "versionCode": 9', '"versionName": "0.4.0",\n  "versionCode": 14')

          replace_once(
              'scripts/generate-icon.mjs',
              '''fillCanvas([0, 0, 0, 255]);
          fillCircle(s(96), s(96), s(76), [246, 248, 251, 255]);
          fillRoundedRect(s(48), s(60), s(72), s(18), s(6), [91, 154, 222, 255]);
          fillRoundedRect(s(48), s(87), s(88), s(18), s(6), [62, 124, 201, 255]);
          fillRoundedRect(s(48), s(114), s(104), s(18), s(6), [43, 96, 174, 255]);''',
              '''// Transparent corners make the launcher silhouette circular. The 186px
          // footprint uses almost the full source canvas so it matches system icon scale.
          fillCircle(s(96), s(96), s(93), [246, 248, 251, 255]);
          fillRoundedRect(s(40), s(56), s(84), s(22), s(8), [91, 154, 222, 255]);
          fillRoundedRect(s(40), s(85), s(104), s(22), s(8), [62, 124, 201, 255]);
          fillRoundedRect(s(40), s(114), s(122), s(22), s(8), [43, 96, 174, 255]);'''
          )

          replace_once(
              'src/common/workout-protocol.js',
              '''function progressPayload(workout, state) {''',
              '''function normalizeProgress(value) {
            if (!value || typeof value !== 'object') {
              return null
            }
            var records = Array.isArray(value.completedRecords) ? value.completedRecords : []
            return {
              workoutId: String(value.workoutId || ''),
              revision: String(value.revision || ''),
              planId: String(value.planId || ''),
              status: value.status === 'complete' || value.status === 'ready' ? value.status : 'active',
              screen: String(value.screen || 'workout'),
              exerciseIndex: Math.max(0, Math.floor(Number(value.exerciseIndex) || 0)),
              setIndex: Math.max(0, Math.floor(Number(value.setIndex) || 0)),
              pendingExerciseIndex: Math.max(0, Math.floor(Number(value.pendingExerciseIndex) || 0)),
              pendingSetIndex: Math.max(0, Math.floor(Number(value.pendingSetIndex) || 0)),
              restEndAt: Math.max(0, Number(value.restEndAt) || 0),
              updatedAt: Math.max(0, Number(value.updatedAt) || 0),
              completedRecords: records.map(function(record) {
                record = record || {}
                return {
                  exerciseIndex: Math.max(0, Math.floor(Number(record.exerciseIndex) || 0)),
                  setIndex: Math.max(0, Math.floor(Number(record.setIndex) || 0)),
                  plannedWeight: numberOrNull(record.plannedWeight),
                  plannedReps: numberOrNull(record.plannedReps),
                  actualWeight: numberOrNull(record.actualWeight),
                  actualReps: numberOrNull(record.actualReps),
                  completedAt: Math.max(0, Number(record.completedAt) || 0)
                }
              })
            }
          }

          function progressMatchesPlan(progress, workout) {
            if (!progress || !workout) {
              return false
            }
            return String(progress.workoutId || '') === String(workout.id || '') &&
              String(progress.revision || '') === String(workout.revision || '')
          }

          function progressPayload(workout, state) {'''
          )
          replace_once(
              'src/common/workout-protocol.js',
              '''  samePlan: samePlan,
            progressPayload: progressPayload''',
              '''  samePlan: samePlan,
            normalizeProgress: normalizeProgress,
            progressMatchesPlan: progressMatchesPlan,
            progressPayload: progressPayload'''
          )

          index = Path('src/pages/index/index.ux')
          text = index.read_text(encoding='utf-8')

          changes = [
            ("var APP_VERSION = '0.3.0'", "var APP_VERSION = '0.4.0'"),
            ('''function validSetIndex(exerciseIndex, setIndex) {
            if (typeof exerciseIndex !== 'number' || typeof setIndex !== 'number') {
              return false
            }
            if (exerciseIndex < 0 || exerciseIndex >= WORKOUT.exercises.length) {
              return false
            }
            var exercise = WORKOUT.exercises[exerciseIndex]
            return setIndex >= 0 && setIndex < exercise.sets.length
          }

          export default {''', '''function validSetIndex(exerciseIndex, setIndex) {
            if (typeof exerciseIndex !== 'number' || typeof setIndex !== 'number') {
              return false
            }
            if (exerciseIndex < 0 || exerciseIndex >= WORKOUT.exercises.length) {
              return false
            }
            var exercise = WORKOUT.exercises[exerciseIndex]
            return setIndex >= 0 && setIndex < exercise.sets.length
          }

          function recordKey(exerciseIndex, setIndex) {
            return String(exerciseIndex) + ':' + String(setIndex)
          }

          export default {'''),
            ('''    completionConfirmed: false,
            completionSynced: false,
            doneStatusTitle: '已保存在手环',''', '''    completionConfirmed: false,
            completionSynced: false,
            syncPending: false,
            progressUpdatedAt: 0,
            lastAckUpdatedAt: 0,
            doneStatusTitle: '已保存在手环','''),
            ('''    this.completionConfirmed = !!state.completionConfirmed
            this.completionSynced = !!state.completionSynced

            var plannedSet''', '''    this.completionConfirmed = !!state.completionConfirmed
            this.completionSynced = !!state.completionSynced
            this.progressUpdatedAt = Number(state.progressUpdatedAt || state.updatedAt) || nowMs()
            this.lastAckUpdatedAt = Number(state.lastAckUpdatedAt) || 0
            this.syncPending = typeof state.syncPending === 'boolean'
              ? state.syncPending
              : (this.completedRecords.length > 0 && !this.completionSynced)

            var plannedSet'''),
            ('''      completionConfirmed: this.completionConfirmed,
              completionSynced: this.completionSynced,
              updatedAt: nowMs()
            }
          },

          saveState() {''', '''      completionConfirmed: this.completionConfirmed,
              completionSynced: this.completionSynced,
              updatedAt: this.progressUpdatedAt || nowMs(),
              progressUpdatedAt: this.progressUpdatedAt || nowMs(),
              syncPending: this.syncPending,
              lastAckUpdatedAt: this.lastAckUpdatedAt
            }
          },

          markProgressDirty() {
            this.progressUpdatedAt = nowMs()
            this.syncPending = true
            if (this.screen === 'complete') {
              this.completionSynced = false
            }
          },

          saveState() {'''),
            ('''    this.completionConfirmed = false
            this.completionSynced = false
            this.refreshDoneStatus()
            this.loadCurrentSet()''', '''    this.completionConfirmed = false
            this.completionSynced = false
            this.syncPending = false
            this.progressUpdatedAt = nowMs()
            this.lastAckUpdatedAt = 0
            this.refreshDoneStatus()
            this.loadCurrentSet()'''),
            ('''    if (message.type === 'plan') {
              this.applyIncomingPlan(message.payload)
              return
            }
            if (message.type === 'progress-ack') {''', '''    if (message.type === 'plan') {
              this.applyIncomingPlan(message.payload)
              return
            }
            if (message.type === 'progress') {
              this.applyIncomingProgress(message.payload)
              return
            }
            if (message.type === 'progress-ack') {'''),
            ('''  applyProgressAck(payload) {
            payload = payload || {}
            if (this.screen !== 'complete') {
              return
            }
            if (String(payload.workoutId || '') !== String(WORKOUT.id || '') ||
                String(payload.revision || '') !== String(WORKOUT.revision || '')) {
              return
            }
            this.completionSynced = true
            this.refreshDoneStatus()
            this.saveState()
          },

          applyIncomingPlan(payload) {''', '''  applyProgressAck(payload) {
            payload = payload || {}
            if (String(payload.workoutId || '') !== String(WORKOUT.id || '') ||
                String(payload.revision || '') !== String(WORKOUT.revision || '')) {
              return
            }
            var ackAt = Number(payload.updatedAt) || 0
            if (ackAt > 0 && ackAt < Number(this.progressUpdatedAt || 0)) {
              return
            }
            this.syncPending = false
            this.lastAckUpdatedAt = ackAt || nowMs()
            if (this.screen === 'complete') {
              this.completionSynced = true
            }
            this.refreshDoneStatus()
            this.saveState()
          },

          applyIncomingProgress(payload) {
            var progress = protocol.normalizeProgress(payload)
            if (!progress || !protocol.progressMatchesPlan(progress, WORKOUT)) {
              return
            }
            if (this.syncPending) {
              this.publishProgress()
              return
            }

            var records = []
            var completed = {}
            for (var i = 0; i < progress.completedRecords.length; i++) {
              var record = progress.completedRecords[i]
              if (!validSetIndex(record.exerciseIndex, record.setIndex)) {
                continue
              }
              var key = recordKey(record.exerciseIndex, record.setIndex)
              if (completed[key]) {
                continue
              }
              completed[key] = true
              records.push(record)
            }

            var previousCompleted = this.completedRecords.length
            var previousScreen = this.screen
            this.stopRestTimer()
            this.completedRecords = records
            this.completedSets = records.length
            this.canUndo = this.completedSets > 0
            this.restEndAt = 0
            this.restRemaining = 0
            this.editing = false
            this.editToggleText = '调整本组'
            this.editOriginalWeight = null
            this.editOriginalReps = 0
            this.completionConfirmed = false
            this.progressUpdatedAt = progress.updatedAt || nowMs()
            this.lastAckUpdatedAt = this.progressUpdatedAt
            this.syncPending = false

            var next = this.firstIncompleteIndices(completed)
            if (progress.status === 'complete' || !next) {
              this.screen = 'complete'
              this.completionSynced = true
              var lastExerciseIndex = Math.max(0, WORKOUT.exercises.length - 1)
              var lastSetIndex = Math.max(0, WORKOUT.exercises[lastExerciseIndex].sets.length - 1)
              this.exerciseIndex = lastExerciseIndex
              this.setIndex = lastSetIndex
              this.pendingExerciseIndex = lastExerciseIndex
              this.pendingSetIndex = lastSetIndex
              this.loadCurrentSet()
            } else {
              this.screen = 'workout'
              this.completionSynced = false
              this.exerciseIndex = next.exerciseIndex
              this.setIndex = next.setIndex
              this.pendingExerciseIndex = next.exerciseIndex
              this.pendingSetIndex = next.setIndex
              this.loadCurrentSet()
            }

            this.refreshDoneStatus()
            this.saveState()
            if (this.completedRecords.length !== previousCompleted || this.screen !== previousScreen) {
              vibrator.vibrate({ mode: 'short' })
            }
            this.sendEnvelope('progress-ack', {
              workoutId: String(WORKOUT.id || ''),
              revision: String(WORKOUT.revision || ''),
              planId: String(WORKOUT.planId || ''),
              updatedAt: this.progressUpdatedAt
            })
          },

          firstIncompleteIndices(completed) {
            for (var exerciseIndex = 0; exerciseIndex < WORKOUT.exercises.length; exerciseIndex++) {
              var exercise = WORKOUT.exercises[exerciseIndex]
              for (var setIndex = 0; setIndex < exercise.sets.length; setIndex++) {
                if (!completed[recordKey(exerciseIndex, setIndex)]) {
                  return { exerciseIndex: exerciseIndex, setIndex: setIndex }
                }
              }
            }
            return null
          },

          applyIncomingPlan(payload) {'''),
            ('''    var same = protocol.samePlan(WORKOUT, plan)
            var activeLocalSession = this.completedRecords.length > 0 && this.screen !== 'complete'
            if (!same && activeLocalSession && WORKOUT.id && WORKOUT.revision) {
              this.publishProgress()
              return
            }

            if (same) {
              return
            }

            if (this.screen === 'complete' && !this.completionSynced) {
              this.publishProgress()
            }

            WORKOUT = plan''', '''    var same = protocol.samePlan(WORKOUT, plan)
            var activeLocalSession = this.completedRecords.length > 0 && this.screen !== 'complete'
            var unsyncedLocalSession = this.syncPending && WORKOUT.id && WORKOUT.revision
            if (!same && (activeLocalSession || unsyncedLocalSession)) {
              this.publishProgress()
              return
            }

            if (same) {
              if (this.syncPending) {
                this.publishProgress()
              }
              return
            }

            WORKOUT = plan'''),
            ('''    this.completedSets = this.completedRecords.length
            this.canUndo = true
            this.setProgress = this.completedSets + ' / ' + this.totalSets
            vibrator.vibrate({ mode: 'short' })''', '''    this.completedSets = this.completedRecords.length
            this.canUndo = true
            this.setProgress = this.completedSets + ' / ' + this.totalSets
            this.markProgressDirty()
            vibrator.vibrate({ mode: 'short' })'''),
            ('''    this.loadCurrentSet(record.actualWeight, record.actualReps)
            this.refreshDoneStatus()
            vibrator.vibrate({ mode: 'short' })''', '''    this.loadCurrentSet(record.actualWeight, record.actualReps)
            this.markProgressDirty()
            this.refreshDoneStatus()
            vibrator.vibrate({ mode: 'short' })''')
          ]

          for old, new in changes:
              if old not in text:
                  raise SystemExit(f'missing expected index block: {old[:100]!r}')
              text = text.replace(old, new, 1)
          index.write_text(text, encoding='utf-8')

          check = Path('scripts/check.mjs')
          text = check.read_text(encoding='utf-8')
          old = '''if (!page.includes("@system.app")) fail("Vela workout page must import system.app");
          if (!protocol.includes("lianleme.workout") || !protocol.includes("VERSION = 1")) fail("Workout Protocol V1 marker is missing");'''
          new = '''if (!page.includes("@system.app")) fail("Vela workout page must import system.app");
          if (!protocol.includes("lianleme.workout") || !protocol.includes("VERSION = 1")) fail("Workout Protocol V1 marker is missing");
          for (const marker of ["applyIncomingProgress", "progress-ack", "syncPending"]) {
            if (!page.includes(marker)) fail(`bidirectional wearable sync marker missing: ${marker}`);
          }
          for (const marker of ["normalizeProgress", "progressMatchesPlan"]) {
            if (!protocol.includes(marker)) fail(`bidirectional protocol marker missing: ${marker}`);
          }'''
          if old not in text:
              raise SystemExit('missing check marker block')
          check.write_text(text.replace(old, new, 1), encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          text = text.replace('当前实机测试基线为 0.3.0：', '当前实机测试基线为 0.4.0：', 1)
          text = text.replace('versionName 0.3.0\nversionCode 9', 'versionName 0.4.0\nversionCode 14', 1)
          text = text.replace('0.3.0 接入手机 ↔ 手环 Workout Protocol V1', '0.4.0 接入手机 ↔ 手环 Workout Protocol V1', 1)
          text = text.replace('当前 0.3.0 已作为首轮真机测试基线冻结。', '当前 0.4.0 已作为双向同步真机测试基线。', 1)
          marker = '- 完成组、撤销、完成训练后回传 progress snapshot\n'
          if marker in text and '手机端进度变化同步回手环' not in text:
              text = text.replace(marker, marker + '- 手机端进度变化同步回手环，并回传 progress-ack\n', 1)
          readme.write_text(text, encoding='utf-8')
          PY

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/apply-main-0.4.0.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix: Vela 0.4.0 bidirectional sync and launcher icon"
          git push origin HEAD:fix/main-0.4.0-sync-icon
