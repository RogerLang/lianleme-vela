name: Publish Vela Release

on:
  workflow_run:
    workflows: ["Signed Vela RPK"]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: vela-release
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout signed main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Resolve release version
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download signed RPK artifact
        if: ${{ steps.meta.outputs.exists != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh run download "$SIGNED_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name lianleme-vela-signed-rpk \
            --dir release-assets
          test -n "$(find release-assets -maxdepth 1 -type f -name '*.rpk' -print -quit)"
          test -s release-assets/signing-certificate.txt

      - name: Publish permanent GitHub Release
        if: ${{ steps.meta.outputs.exists != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          ## 练了么 Vela ${VERSION}

          自动签名构建归档。

          - Vela CI 已通过
          - 正式签名 RPK 已生成
          - Workout Protocol V1
          - 与 Android 正式 APK 使用同一签名身份

          下载 Assets 中的 RPK 文件即可长期保存或重新安装。signing-certificate.txt 用于核对签名证书指纹。

          Xiaomi Smart Band 9 Pro 的布局、震动、退出、离线恢复和手机互联仍需以实际设备验收结果为准。
          EOF

          gh release create "$TAG" \
            release-assets/*.rpk \
            release-assets/signing-certificate.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "练了么 Vela ${VERSION}" \
            --notes-file release-notes.md

      - name: Release already exists
        if: ${{ steps.meta.outputs.exists == 'true' }}
        run: echo "Release ${{ steps.meta.outputs.tag }} already exists; keeping the archived release unchanged."
