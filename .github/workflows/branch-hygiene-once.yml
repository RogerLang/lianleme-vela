name: One-time branch hygiene

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/branch-hygiene-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete non-main branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name' | while IFS= read -r branch; do
            [ "$branch" = "main" ] && continue
            encoded=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$branch")
            echo "Deleting branch: $branch"
            gh api -X DELETE "repos/$REPO/git/refs/heads/$encoded"
          done

      - name: Enable delete-branch-on-merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api -X PATCH "repos/$REPO" -f delete_branch_on_merge=true
